[project]
name = "pdf-toolkit"
version = "0.1.0"
description = "A comprehensive PDF toolkit with merge, split, compress, conversion, and comparison features"
authors = []
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24.0",
    "Pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "click>=8.0.0",
    "gradio>=4.0.0",
]

[project.scripts]
pdf-toolkit = "pdf_toolkit.cli:cli"
pdf-toolkit-ui = "pdf_toolkit.app:main"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.mypy.fitz]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=pdf_toolkit --cov-report=term --cov-report=html --cov-fail-under=80"
